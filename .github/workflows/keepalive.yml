name: Keep Streamlit app awake

on:
  schedule:
    # Every 4 hours (UTC). Community Cloud sleeps after 12h of no traffic, so
    # this keeps a comfortable margin even when GitHub delays or skips a run.
    - cron: "0 */4 * * *"
  workflow_dispatch: {}  # lets you trigger a run manually from the Actions tab

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      APP_URL: https://ragforge-app.streamlit.app/
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright + Chromium
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Run keepalive
        run: python keepalive.py
